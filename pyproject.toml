[project]
name = "crud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ammarbhat", email = "bhatmmr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
crud = "crud:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.crud.main:app"
